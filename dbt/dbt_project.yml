name: pset2_mora
version: "1.0.0"
config-version: 2
profile: pset2_mora

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  label_month: "2005-10"
  observation_month: "2005-09"   # último mes observable antes del target

models:
  pset2_mora:
    bronze:
      +schema: BRONZE
      +materialized: view
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      +schema: GOLD
      +materialized: table

tests:
  pset2_mora:
    +severity: error
