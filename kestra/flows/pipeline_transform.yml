id: pipeline_transform
namespace: usfq.pset2
description: |
  Transformación posterior a la ingesta: dbt (Bronze -> Silver -> Gold + tests) y Spark (OBT).
  Se dispara automáticamente cuando uci_ingest_monthly o uci_backfill terminan con SUCCESS.
  Si un test de dbt falla, Spark no corre: la OBT nunca se construye sobre datos que no pasaron calidad.

labels:
  project: anticipar-mora
  layer: transform

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: dbt_build
    type: io.kestra.plugin.dbt.cli.DbtCLI
    description: dbt build = run + test en orden de dependencias (source -> ref)
    namespaceFiles:
      enabled: true
      include:
        - dbt/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/dbt-snowflake:latest
    env:
      SNOWFLAKE_ACCOUNT: "{{ secret('SNOWFLAKE_ACCOUNT') }}"
      SNOWFLAKE_USER: "{{ secret('SNOWFLAKE_USER') }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
      SNOWFLAKE_ROLE: "{{ secret('SNOWFLAKE_ROLE') }}"
      SNOWFLAKE_WAREHOUSE: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
      SNOWFLAKE_DATABASE: "{{ secret('SNOWFLAKE_DATABASE') }}"
    commands:
      - dbt build --project-dir dbt --profiles-dir dbt --target prod
    retry:
      type: constant
      interval: PT1M
      maxAttempts: 2

  - id: spark_obt
    type: io.kestra.plugin.scripts.shell.Commands
    description: Construye la OBT con Spark desde Gold y la escribe en Snowflake
    namespaceFiles:
      enabled: true
      include:
        - spark/build_obt.py
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: pset2_net
    containerImage: apache/spark:3.4.1
    env:
      SNOWFLAKE_ACCOUNT: "{{ secret('SNOWFLAKE_ACCOUNT') }}"
      SNOWFLAKE_USER: "{{ secret('SNOWFLAKE_USER') }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
      SNOWFLAKE_ROLE: "{{ secret('SNOWFLAKE_ROLE') }}"
      SNOWFLAKE_WAREHOUSE: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
      SNOWFLAKE_DATABASE: "{{ secret('SNOWFLAKE_DATABASE') }}"
    commands:
      - >
        /opt/spark/bin/spark-submit
        --master local[*]
        --conf spark.jars.ivy=/tmp/.ivy
        --packages net.snowflake:spark-snowflake_2.12:2.16.0-spark_3.4,net.snowflake:snowflake-jdbc:3.16.1
        spark/build_obt.py --mode snowflake
    retry:
      type: constant
      interval: PT2M
      maxAttempts: 2

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "FALLÓ la transformación (execution {{ execution.id }}). Revisar dbt_build / spark_obt."

