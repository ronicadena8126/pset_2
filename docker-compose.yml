# Infraestructura local del PSet 2 (misma configuración de Kestra que el lab de la Semana 4): Kestra (+ Postgres de metadatos), Spark (master + worker) y dbt.
# Snowflake es el destino (SaaS); las credenciales se leen de .env / .env_encoded (no versionados).
name: pset2

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:-k3str4}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kestra -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pset2_net]

  kestra:
    image: ${KESTRA_IMAGE:-kestra/kestra:v2.0.7}
    command: server standalone
    user: "root"                      # necesario para usar el Docker task runner
    env_file:
      - .env_encoded                  # SECRET_SNOWFLAKE_* en base64 (scripts/encode_secrets.sh)
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:-k3str4}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER:-admin@kestra.io}
              password: ${KESTRA_PASSWORD:-Admin1234}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pset2_net]

  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:3.4.1}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    env_file: [.env]
    ports:
      - "8082:8080"   # UI del master (8080 lo usa Kestra)
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark-apps
    networks: [pset2_net]

  spark-worker:
    image: ${SPARK_IMAGE:-apache/spark:3.4.1}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    env_file: [.env]
    depends_on: [spark-master]
    volumes:
      - ./spark:/opt/spark-apps
    networks: [pset2_net]

  # dbt Core en Docker. Se usa bajo demanda: docker compose run --rm dbt build --target prod
  dbt:
    image: ${DBT_IMAGE:-ghcr.io/dbt-labs/dbt-snowflake:1.9.latest}
    profiles: ["tools"]
    working_dir: /usr/app/dbt
    env_file: [.env]
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
    volumes:
      - ./dbt:/usr/app/dbt
    networks: [pset2_net]

volumes:
  postgres-data:
  kestra-data:

networks:
  pset2_net:
    name: pset2_net
